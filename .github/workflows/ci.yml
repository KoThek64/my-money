name: CI

# Stratégie de branches : master ← dev
#   - on code sur `dev`, puis on ouvre une PR `dev → master`
#   - push sur dev : contrôle rapide — tests « todo » tolérés, mutation des
#     seules lignes modifiées par rapport à master
#   - PR vers master : garde-fou avant fusion — aucun « todo », suite entière,
#     mutation de tout le code
on:
  push:
    branches: [dev]
  pull_request:
    branches: [master]

# Annule un run en cours si on repousse sur la même branche/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    # Le nom affiché sur une PR est le check exigé par la protection de master :
    # le run de dev en porte un autre pour ne jamais le satisfaire à sa place.
    name: ${{ github.event_name == 'pull_request' && 'Qualité (cs · phpstan · rector · tests)' || 'Qualité dev (cs · phpstan · rector · tests)' }}
    runs-on: ubuntu-latest

    # Base de données jetable pour les tests (miroir de la prod : Postgres 16)
    services:
      database:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app_test
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      DATABASE_URL: "postgresql://app:app@127.0.0.1:5432/app_test?serverVersion=16&charset=utf8"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Historique complet : Infection compare les lignes à origin/master.
          fetch-depth: 0

      - name: Installer PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype, iconv, intl, pdo_pgsql, pgsql
          # PCOV : Infection a besoin de la couverture pour cibler les tests.
          coverage: pcov
          tools: composer:v2

      - name: Valider composer.json / composer.lock
        run: composer validate --strict

      - name: Cache des dépendances Composer
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      # --no-scripts : pas de cache warmup ni d'assets à l'install → plus rapide
      # et plus robuste. Le seul asset dont les tests dépendent est buildé plus bas.
      - name: Installer les dépendances
        run: composer install --no-progress --prefer-dist --no-scripts

      # Les étapes suivantes tournent toutes même si l'une échoue (!cancelled()),
      # pour voir tous les problèmes d'un coup ; le job échoue si l'une a échoué.
      - name: Coding standards (php-cs-fixer)
        if: ${{ !cancelled() }}
        run: php vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Analyse statique (PHPStan)
        if: ${{ !cancelled() }}
        run: php vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Refactos proposées (Rector)
        if: ${{ !cancelled() }}
        run: php vendor/bin/rector process --dry-run

      - name: Préparer la base de test
        if: ${{ !cancelled() }}
        run: |
          php bin/console doctrine:database:create --if-not-exists --no-interaction
          php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration

      # base.html.twig charge les assets : sans eux, tout test fonctionnel casse
      # au rendu. assets/vendor n'est pas versionné et --no-scripts coupe les
      # deux commandes que l'install ferait normalement — d'où ces deux lignes.
      - name: Préparer les assets
        if: ${{ !cancelled() }}
        run: |
          php bin/console importmap:install
          php bin/console sass:build

      # Un test « todo » décrit un comportement pas encore codé : toléré sur dev,
      # jamais sur master (Infection les ignore, un oubli passerait inaperçu).
      - name: Aucun test « todo » vers master
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          if grep -rn "Group('todo')" tests; then
            echo "::error::Des tests sont encore marqués « todo » : à coder avant de fusionner vers master."
            exit 1
          fi

      - name: Tests (PHPUnit) — dev, hors « todo »
        if: ${{ !cancelled() && github.event_name == 'push' }}
        run: php bin/phpunit --exclude-group=todo

      - name: Tests (PHPUnit) — suite entière
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: php bin/phpunit

      # Pas de !cancelled() sur les mutations : elles n'ont de sens que si tout
      # le reste est vert.
      # Sur dev, sans seuil : du code dont le test est encore « todo » laisse
      # forcément des survivants. L'étape les affiche, elle ne bloque pas.
      - name: Tests de mutation (Infection) — lignes modifiées depuis master
        if: ${{ github.event_name == 'push' }}
        run: >-
          php vendor/bin/infection
          --git-diff-lines --git-diff-base=origin/master
          --no-progress --show-mutations

      # Vers master, aucun survivant toléré.
      - name: Tests de mutation (Infection) — tout le code
        if: ${{ github.event_name == 'pull_request' }}
        run: >-
          php vendor/bin/infection
          --min-msi=100 --min-covered-msi=100
          --no-progress --show-mutations
